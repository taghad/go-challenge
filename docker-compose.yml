services:
  redis:
    image: redis:8.2.3
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      # The default of 3gb is an estimate [E].
      - --maxmemory
      - ${REDIS_MAXMEMORY:-3gb}
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  # Used only by the test service. It has no volume or AOF, so test data never
  # mixes with the data of the redis service.
  redis-test:
    image: redis:8.2.3
    profiles: ["test"]
    command:
      - redis-server
      - --appendonly
      - "no"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  # Runs only on request: docker compose run --rm test
  test:
    image: golang:1.27.3
    profiles: ["test"]
    working_dir: /src
    command: ["go", "test", "-race", "./..."]
    environment:
      REDIS_ADDR: redis-test:6379
    volumes:
      - .:/src
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      redis-test:
        condition: service_healthy

volumes:
  redis-data:
  go-mod-cache:
  go-build-cache:
