services:
  # It has no healthcheck, because the image has no shell or client to run one with.
  es:
    build:
      context: .
      target: server
    restart: on-failure
    # ES has no authentication, so it is published on this machine only.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ESTIMATE_CACHE_TTL: 5s
    # Longer than the default SHUTDOWN_TIMEOUT of 10s, so that docker does not kill ES
    # while in-flight requests are still finishing.
    stop_grace_period: 15s
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:8.2.3
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      # The default of 3gb is an estimate [E].
      - --maxmemory
      - ${REDIS_MAXMEMORY:-3gb}
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  # Used only by the test service. It has no volume or AOF, so test data never
  # mixes with the data of the redis service. The tmpfs replaces the anonymous
  # volume that the image would otherwise create for /data.
  redis-test:
    image: redis:8.2.3
    profiles: ["test"]
    command:
      - redis-server
      - --appendonly
      - "no"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  # Runs only on request: docker compose run --rm test
  test:
    image: golang:1.27.3
    profiles: ["test"]
    working_dir: /src
    # -p 1 runs one package at a time, because a test can pause all of redis-test.
    command: ["go", "test", "-p", "1", "-race", "./..."]
    environment:
      REDIS_ADDR: redis-test:6379
    volumes:
      - .:/src
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      redis-test:
        condition: service_healthy

volumes:
  redis-data:
  go-mod-cache:
  go-build-cache:
