services:
  # It has no healthcheck, because the image has no shell or client to run one with.
  es:
    build:
      context: .
      target: server
    restart: on-failure:5
    # ES has no authentication, so it is published on this machine only.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ESTIMATE_CACHE_TTL: 5s
    # Longer than the default SHUTDOWN_TIMEOUT of 10s, so that docker does not kill ES
    # while in-flight requests are still finishing.
    stop_grace_period: 15s
    depends_on:
      redis:
        condition: service_healthy

  # Runs only on request, in its own container, and reaches ES through the compose
  # network: docker compose run --rm uss -rate 1000 -duration 30s
  uss:
    build:
      context: .
      target: uss
    profiles: ["tools"]
    depends_on:
      - es

  redis:
    image: redis:8.2.11
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      # The default of 3gb is an estimate [E].
      - --maxmemory
      - ${REDIS_MAXMEMORY:-3gb}
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  # Used only by the test service. It has no volume or AOF, so test data never
  # mixes with the data of the redis service. The tmpfs replaces the anonymous
  # volume that the image would otherwise create for /data.
  redis-test:
    image: redis:8.2.11
    profiles: ["test"]
    command:
      - redis-server
      - --appendonly
      - "no"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  # Runs only on request: docker compose run --rm test
  test:
    image: golang:1.27.3
    profiles: ["test"]
    working_dir: /src
    # -p 1 runs one package at a time, because a test can pause all of redis-test.
    command: ["go", "test", "-p", "1", "-race", "./..."]
    environment:
      REDIS_ADDR: redis-test:6379
    volumes:
      - .:/src
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      redis-test:
        condition: service_healthy

  # Runs the measurements at full size, without -race, whose overhead would distort
  # them: docker compose run --rm measure
  measure:
    image: golang:1.27.3
    profiles: ["test"]
    working_dir: /src
    command: ["go", "test", "-p", "1", "-count=1", "-v", "-timeout", "60m", "-run", "Measure", "./..."]
    environment:
      REDIS_ADDR: redis-test:6379
      ES_MEASURE: "1"
    volumes:
      - .:/src
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      redis-test:
        condition: service_healthy

  # Used only by the bench service, which flushes it. hll-sparse-max-bytes 0 makes
  # every key dense, which is the worst case for memory. It has no maxmemory, so that
  # the benchmark measures the memory instead of hitting a limit.
  redis-bench:
    image: redis:8.2.11
    profiles: ["bench"]
    command:
      - redis-server
      - --appendonly
      - "no"
      - --save
      - ""
      - --hll-sparse-max-bytes
      - "0"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  # Runs only on request: docker compose run --rm bench
  bench:
    image: golang:1.27.3
    profiles: ["bench"]
    working_dir: /src
    command: ["go", "test", "-count=1", "-v", "-timeout", "60m", "-run", "TestMeasureBucketBenchmark", "./internal/redisstore/"]
    environment:
      REDIS_BENCH_ADDR: redis-bench:6379
    volumes:
      - .:/src
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      redis-bench:
        condition: service_healthy

volumes:
  redis-data:
  go-mod-cache:
  go-build-cache:
