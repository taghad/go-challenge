services:
  redis:
    image: redis:8.2.3
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  # Runs only on request: docker compose run --rm test
  test:
    image: golang:1.27.3
    profiles: ["test"]
    working_dir: /src
    command: ["go", "test", "./..."]
    environment:
      REDIS_ADDR: redis:6379
    volumes:
      - .:/src
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
  go-mod-cache:
  go-build-cache:
